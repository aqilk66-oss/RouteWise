<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>RouteWise — Every Route, Under Control</title>
    <meta name="description" content="RouteWise is the enterprise-grade school transport operations and live GPS bus tracking platform. Real-time telemetry, geofence alerts, attendance, and intelligent student safety." />
    <meta name="theme-color" content="#183B56" />

    <!-- Security Headers & Content Security Policy (Stage 27) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://firebasestorage.googleapis.com https://images.unsplash.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://api.emailjs.com; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self';" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RouteWise — School Transport & Bus Tracking Platform" />
    <meta property="og:description" content="Next-generation school bus dispatch, live GPS tracking, student attendance verification, and safety command center." />
    <meta property="og:image" content="/assets/logo.png" />
    <meta property="og:site_name" content="RouteWise" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RouteWise — School Transport & Bus Tracking Platform" />
    <meta name="twitter:description" content="Next-generation school bus dispatch, live GPS tracking, student attendance verification, and safety command center." />
    <meta name="twitter:image" content="/assets/logo.png" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
